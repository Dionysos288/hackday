<!doctype html>
<html lang="en" data-paper="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forms lab</title>
<link rel="icon" href="data:,">
<meta name="description" content="Try each sheet: sign in, the email step for voting, submit, remind me and share.">
<link rel="stylesheet" href="../shared/brand.css">
<script src="../shared/palette.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/forms.css">
<script src="../shared/seal.js"></script>
<style>
  html { background: var(--c-ground); scrollbar-gutter: stable; }
  body { margin: 0; min-height: 100vh; background: var(--c-ground); color: var(--c-ink); font: var(--w-regular) var(--t-md)/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  .lab { max-width: 960px; margin: 0 auto; padding: var(--s-6) var(--s-5) var(--s-8); }
  .lab-h { display: flex; justify-content: space-between; align-items: end; gap: var(--s-4); flex-wrap: wrap; padding-bottom: var(--s-4); box-shadow: inset 0 calc(-1 * var(--line-hair)) 0 var(--c-line); }
  .lab h1 { margin: 0; font-size: var(--t-h1); line-height: 1.1; font-weight: var(--w-regular); letter-spacing: var(--track-tight); }
  .lab-k { margin: 0 0 var(--s-2); font: var(--w-medium) var(--t-label)/1.2 var(--font-mono); letter-spacing: var(--t-label-track); text-transform: uppercase; color: var(--c-ink-2); }
  .lab-sec { padding: var(--s-5) 0; box-shadow: inset 0 calc(-1 * var(--line-hair)) 0 var(--c-line); }
  .lab-row { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .lab-seg { display: inline-flex; }
  .lab-seg .fm-b { box-shadow: inset 0 0 0 var(--line-thin) var(--c-line); }
  .lab-seg .fm-b[aria-pressed="true"] { background: var(--c-ink); color: var(--c-ground); box-shadow: none; }
  .lab-state, .lab-log { margin: 0; font: var(--w-medium) var(--t-xs)/1.6 var(--font-mono); color: var(--c-ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
  .lab-state b { font-weight: var(--w-medium); color: var(--c-ink); }
  .lab-note { margin: var(--s-3) 0 0; font-size: var(--t-sm); color: var(--c-ink-2); max-width: 60ch; }
</style>
</head>
<body>
<main class="lab">
  <header class="lab-h">
    <div><p class="lab-k">Supabase Hackathon</p><h1>Forms lab</h1></div>
    <div class="lab-seg" role="group" aria-label="Ground">
      <button class="fm-b" type="button" data-ground="night">Night</button><button class="fm-b" type="button" data-ground="paper">Paper</button><button class="fm-b" type="button" data-ground="mint">Mint</button>
    </div>
  </header>

  <section class="lab-sec" aria-labelledby="k-flows">
    <p class="lab-k" id="k-flows">Flows</p>
    <div class="lab-row">
      <button class="fm-b" type="button" data-run="signIn">Sign in</button>
      <button class="fm-b" type="button" data-run="ensureVoter">Vote (email step)</button>
      <button class="fm-b g" type="button" data-run="submit">Submit project</button>
      <button class="fm-b" type="button" data-run="submitClosed">Submit after the deadline</button>
      <button class="fm-b" type="button" data-run="remind">Remind me</button>
      <button class="fm-b" type="button" data-run="share">Share a project</button>
      <button class="fm-b" type="button" data-run="shareMine">Share your entry</button>
    </div>
    <p class="lab-note">Any six digits work as the code. Submit opens sign-in first when no one is signed in. The network takes about 0.6&nbsp;s.</p>
  </section>

  <section class="lab-sec" aria-labelledby="k-state">
    <p class="lab-k" id="k-state">FORMS.state</p>
    <p class="lab-state" id="state" aria-live="polite"></p>
    <p class="lab-k" style="margin-top: var(--s-4)">Last result</p>
    <p class="lab-log" id="log">Nothing yet.</p>
  </section>

  <section class="lab-sec" aria-labelledby="k-data">
    <p class="lab-k" id="k-data">Stored data</p>
    <div class="lab-row"><button class="fm-b" type="button" data-run="signOut">Sign out</button><button class="fm-b" type="button" data-run="reset">Reset stored data</button></div>
  </section>
</main>
<script src="../shared/forms.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  if (window.SEAL) SEAL.load('../saved/seal.config.json');
  /* Berlin: building until 10:30 UTC today */
  var today = new Date(); today.setUTCHours(0, 0, 0, 0);
  var at = function (h, m) { return new Date(today.getTime() + (h * 60 + m) * 60000); };
  var BERLIN = { city: 'berlin', cityName: 'Berlin', deadline: new Date(Date.now() + 3 * 3600000) };
  var SAMPLE = { name: 'Sentry Pup', pitch: 'A watchdog for your Edge Functions that barks in Slack before your users notice.', handle: 'mira_k', city: 'berlin', cityName: 'Berlin', slug: 'sentry-pup', votes: 45, rank: 1 };

  function paintState(st) {
    st = st || FORMS.state;
    var e = st.entry ? { name: st.entry.name, city: st.entry.city, slug: st.entry.slug, picture: st.entry.picture ? 'yes' : 'no' } : null;
    $('#state').innerHTML = 'signedIn <b>' + st.signedIn + '</b> · handle <b>' + (st.handle || 'null') + '</b> · email <b>' + (st.email || 'null') + '</b> · voter <b>' + st.voter + '</b>\nentry <b>' + (e ? JSON.stringify(e) : 'null') + '</b>';
  }
  function log(name, v) { $('#log').textContent = name + ' → ' + (typeof v === 'string' ? v : JSON.stringify(v && v.picture ? Object.assign({}, v, { picture: '(data URL)' }) : v)); }
  FORMS.on('change', paintState); paintState();

  var RUN = {
    signIn: function () { return FORMS.signIn(); },
    ensureVoter: function () { return FORMS.ensureVoter(); },
    submit: function () { return FORMS.submit(BERLIN); },
    submitClosed: function () { return FORMS.submit({ city: 'berlin', cityName: 'Berlin', deadline: new Date(Date.now() - 60000) }); },
    remind: function () { return FORMS.remind({ city: 'tokyo', cityName: 'Tokyo', when: at(0, 0) }); },
    share: function () { return FORMS.share(SAMPLE); },
    shareMine: function () { var e = FORMS.state.entry; return FORMS.share(e ? { name: e.name, pitch: e.pitch, handle: e.handle, city: e.city, cityName: e.cityName, slug: e.slug } : SAMPLE); },
    signOut: function () { return FORMS.signOut(); },
    reset: function () { FORMS._reset(); return Promise.resolve('cleared'); }
  };
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-run]'); if (b) { var n = b.dataset.run; Promise.resolve(RUN[n]()).then(function (v) { log(n === 'submitClosed' ? 'submit' : n, v === undefined ? 'done' : v); }); }
    var g = e.target.closest('[data-ground]'); if (g) setGround(g.dataset.ground);
  });
  function setGround(name) {
    window.dayPalette(name);
    document.querySelectorAll('[data-ground]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.ground === document.documentElement.dataset.ground)); });
    var u = new URL(location.href); if (name === 'night') u.searchParams.delete('ground'); else u.searchParams.set('ground', name); history.replaceState(null, '', u);
  }
  setGround(document.documentElement.dataset.ground || 'night');
})();
</script>
</body>
</html>
